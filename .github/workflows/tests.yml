name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # No API key, no model server: every suite talks to a local fake engine.
      # The runner exits non-zero as soon as one autotest or E2E fails (checked at the end of the run).
      - name: Autotests and end-to-end suites
        run: python3 public/tests/run_all.py
