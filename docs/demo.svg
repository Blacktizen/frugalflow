<circle cx="54" cy="14" r="5" fill="#3fb950"/>
<text class="l l0 cmd" x="20" y="52"><tspan class="p">$ </tspan>pipx install git+https://github.com/Blacktizen/frugalflow</text>
<text class="l l1 plain" x="20" y="72">  installed package frugalflow 0.1.0, installed using Python 3.12</text>
<text class="l l2 plain" x="20" y="92">  These apps are now globally available</text>
<text class="l l3 plain" x="20" y="112">    - frugalflow</text>
<text class="l l4 ok" x="20" y="132">done!</text>
<text class="l l5 cmd" x="20" y="52"><tspan class="p">$ </tspan>frugalflow scan ./demo-app</text>
<text class="l l6 warn" x="20" y="72">app.py:4: secret credential in clear</text>
<text class="l l7 fail" x="20" y="92">FOUND 1 leak(s) in 1 file(s)</text>
<text class="l l8 dim" x="20" y="112">Fix: remove the value and load it from an environment variable, then scan again.</text>
<text class="l l9 dim" x="20" y="132">False positive? Keep that file out of the scanned folder or list it in .gitignore.</text>
<text class="l l10 dim" x="20" y="152">exit code 12</text>
<text class="l l11 cmd" x="20" y="52"><tspan class="p">$ </tspan>frugalflow setup --yes</text>
<text class="l l12 ok" x="20" y="72">FOUND lmstudio http://127.0.0.1:1234</text>
<text class="l l13 ok" x="20" y="92">CHOSEN LM Studio at http://127.0.0.1:1234</text>
<text class="l l14 ok" x="20" y="112">FOUND lmstudio http://127.0.0.1:1234</text>
<text class="l l15 plain" x="20" y="132">BLOCK ~/.claude/CLAUDE.md</text>
<text class="l l16 plain" x="20" y="152">HOOKS ~/.claude/settings.json</text>
<text class="l l17 ok" x="20" y="172">SETUP DONE. Next: frugalflow scan .   To undo: frugalflow uninstall</text>
<text class="l l18 cmd" x="20" y="52"><tspan class="p">$ </tspan>frugalflow doctor</text>
<text class="l l19 ok" x="20" y="72">OK home ~/.frugalflow</text>
<text class="l l20 ok" x="20" y="92">OK settings files valid (models.json, preferences.json)</text>
<text class="l l21 ok" x="20" y="112">OK guard.json</text>
<text class="l l22 ok" x="20" y="132">OK anonymization.json</text>
<text class="l l23 ok" x="20" y="152">OK CLAUDE.md has the FrugalFlow block</text>
<text class="l l24 ok" x="20" y="172">OK settings.json has the FrugalFlow hook</text>
<text class="l l25 ok" x="20" y="192">OK status line: FrugalFlow segment in place</text>
<text class="l l26 ok" x="20" y="212">OK switch: FrugalFlow on, mode observe</text>
<text class="l l27 warn" x="20" y="232">WARN guard mode: OBSERVE - the guards log what they would refuse but do NOT block anything. Turn ...</text>
<text class="l l28 dim" x="20" y="252">INFO FOUND lmstudio http://127.0.0.1:1234</text>
<text class="l l29 ok" x="20" y="272">OK engine local-reader answers</text>
